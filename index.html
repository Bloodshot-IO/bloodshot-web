  /* ─────────────────────────────────────────────────────────────
     Paleta y tipografía tomadas de bloodshot.io v1

  :root{
    --red:#DC2626;
    --red-dim:rgba(220,38,38,0.14);
    --bg:#050505;
    --surface:#111111;
    --surface-hi:#171717;

    --mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,monospace;
    --r:14px;

    /* Escala fluida ligada a la altura del viewport: es lo que permite
       que TODO quepa de un vistazo, de un iPhone SE a un Pro Max, sin
       scroll. Cada medida vertical tiene mínimo (pantalla corta),
       valor en vh (proporcional) y máximo (pantalla alta). */
    /* Medidas FIJAS. Nada aquí depende de vh/svh/dvh ni de medir el
       viewport con JS: Chrome en iOS informaba de una altura mayor que
       la visible y cualquier cálculo basado en ella descuadraba la
       página. Los tamaños crecen por breakpoints de altura, y cada
       escalón se diseña con ~100px de margen (lo que ocupan las barras
       de Chrome), de modo que aunque el navegador exagere, cabe igual. */
    --pad-y:14px;   --head-pt:38px;  --head-mb:14px;
    --gap:6px;      --btn-h:52px;    --ico:28px;
    --sep-mt:10px;  --sep-mb:7px;    --sep-fs:9.5px;

    --logo-h:24px;  --tag-mt:6px;
    --label:13.5px; --meta:10.5px;   --icosvg:17px;
  }

  /* Cada escalón se activa por la altura que informa el navegador, pero
     está dimensionado para el alto REAL que quedaría si esa cifra viene
     inflada por las barras. */
  /* Escalones de tamaño. Medidas fijas: nada depende de vh/svh/dvh.

     El contenido se dimensiona ~40px POR ENCIMA de la altura de la
     ventana, de modo que la página SIEMPRE tenga un poco de scroll.
     Se intentó ajustarlo para que cupiera exacto (sin scroll) y Chrome
     volvió a abrir la página cortada: al aplicarse la fuente Inter el
     contenido excede un instante, Chrome desplaza la página y, si no
     queda scroll, se queda atorada sin forma de volver arriba. Con este
     margen, el script del final la devuelve a su sitio.

  *{box-sizing:border-box;}
  /* Un display explícito (p.ej. .wm{display:inline-flex}) gana al
     atributo hidden; sin esto el wordmark alternativo se vería SIEMPRE. */
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;}

  /* Nada de position:fixed ni overflow:hidden. Los webview embebidos
     (WhatsApp, Instagram) resuelven el viewport de forma distinta al
     navegador: al anclar el documento, la cabecera quedaba fuera de
     pantalla y, con el scroll bloqueado, era IRRECUPERABLE.
     El criterio correcto es que no haya scroll porque el contenido cabe
     —se dimensiona contra 100svh, el viewport con las barras visibles—
     y no porque esté prohibido. Si un webview raro se desvía, el usuario
     puede desplazarse en vez de quedarse sin ver media página. */
  /* La página sí puede desplazarse (el contenido la supera a propósito),
     pero se desactiva el ANCLAJE de scroll de Chrome: cuando Inter
     termina de descargarse el texto cambia de tamaño, el documento
     cambia de altura y Chrome desplaza la página para "conservar la
     posición de lectura" — dejando el logo fuera. Safari no implementa
     scroll anchoring, y por eso el fallo era sólo de Chrome. */
  html,body{
    overflow-x:hidden;
    overflow-anchor:none;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:0 clamp(14px, 5vw, 20px);
  }

  /* El vidrio sólo se lee si hay algo detrás que desenfocar y teñir.
     Sobre un negro plano el efecto es invisible, así que el fondo lleva
     dos focos muy tenues: uno rojo arriba y otro frío abajo. */
  body::before{
    content:"";
    position:fixed;
    top:-180px; left:50%;
    width:min(560px, 140vw); height:460px;
    transform:translateX(-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(220,38,38,0.11), transparent 70%);
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed;
    bottom:-140px; left:-80px;
    width:min(460px, 120vw); height:400px;
    background:radial-gradient(50% 50% at 50% 50%, rgba(120,130,190,0.05), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    /* Se reserva el área segura ARRIBA además de abajo: la hipótesis es
       que la barra de Chrome se superpone al contenido durante el
       arranque en frío y tapa el logo. */
    padding:calc(var(--head-pt) + env(safe-area-inset-top, 0px)) 0
            calc(var(--pad-y) + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
  }

  /* ---------- header ---------- */
  .head{ text-align:center; margin-bottom:var(--head-mb); }

  /* Logo maestro (versión dark: texto blanco). Se mide por altura para
     que escale con el viewport, y se limita por ancho en pantallas
     estrechas para que nunca toque los bordes. */
  .logo{
    display:block;
    margin:0 auto;
    height:var(--logo-h);
    width:auto;
    max-width:78%;
    object-fit:contain;
  }

  .wm{
    display:inline-flex;
    align-items:center;
    font-weight:700;
    font-size:31px;
    letter-spacing:-0.05em;
    line-height:1;
    white-space:nowrap;
  }
  .wm .dot{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--red);
    margin-right:9px;
    box-shadow:0 0 12px 1px rgba(220,38,38,0.8);
    flex:0 0 auto;
  }
  .wm .lo{ font-weight:300; color:var(--muted); }

  /* Una sola línea: el tamaño cede antes que el salto de renglón. */
  .tagline{
    margin:var(--tag-mt) auto 0;
    font-size:clamp(10.5px, 3.05vw, 14.5px);
    color:var(--muted);
    line-height:1.4;
    white-space:nowrap;
  }

  /* ---------- botones ---------- */
  /* Los grupos crecen para llenar la altura disponible y cada botón se
     reparte esa altura por igual (flex-grow proporcional al nº de
     botones). Así el sobrante se convierte en botón más grande, no en
     un hueco muerto antes del pie. El tope evita que en pantallas muy
     altas se vuelvan desproporcionados. */
  .stack{ display:flex; flex-direction:column; gap:var(--gap); }
  .stack .btn{ flex:none; height:var(--btn-h); }

  /* ── LIQUID GLASS ────────────────────────────────────────────────
     Geometría heredada de la versión previa: gap 14px, padding 16/18,
     radio 14px, borde 1px, icono 38x38. Sólo cambia el material.

     El componente de referencia apoya el efecto en
     backdrop-filter:url(#container-glass) — un filtro SVG de
     desplazamiento. Eso SÓLO lo soporta Firefox; Chrome y Safari lo
     ignoran en silencio, así que en un celular no se vería nada. El
     vidrio real se construye aquí con blur+saturate (soportado en
     iOS/Android) y biseles inset; la refracción del filtro queda
     abajo como mejora progresiva. */
  .btn{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:clamp(10px, 3.2vw, 14px);
    padding:0 clamp(13px, 4.4vw, 18px);
    border-radius:var(--r);
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(255,255,255,0.042);
    -webkit-backdrop-filter:blur(16px) saturate(175%);
            backdrop-filter:blur(16px) saturate(175%);
    box-shadow:
      inset 1.5px 1.5px 1px -1px rgba(255,255,255,0.34),
      inset -1.5px -1.5px 1px -1px rgba(255,255,255,0.16),
      inset 0 0 8px 6px rgba(255,255,255,0.020),
      inset 0 0 2px 2px rgba(255,255,255,0.026),
      0 4px 16px rgba(0,0,0,0.50),
      0 1px 2px rgba(0,0,0,0.35);
    text-decoration:none;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    transition:background-color .18s ease, border-color .18s ease,
               box-shadow .18s ease, transform .18s ease;
  }
  /* Reflejo especular: entra por la esquina superior izquierda. */
  .btn::before{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(135deg,
      rgba(255,255,255,0.085) 0%,
      rgba(255,255,255,0.025) 26%,
      transparent 52%);
    pointer-events:none;
    z-index:0;
  }
  .btn > *{ position:relative; z-index:1; }

  .btn:hover, .btn:focus-visible{
    background:rgba(255,255,255,0.085);
    border-color:rgba(255,255,255,0.22);
  }
  .btn:active{ transform:scale(0.985); }
  .btn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

  /* ── Acento: "Agenda una llamada" ───────────────────────────────
     Mismo cristal, teñido por una luz roja que entra en diagonal
     desde la esquina superior izquierda. Sin cambiar geometría. */
  .btn--glow{
    border-color:rgba(220,38,38,0.22);
    background:
      linear-gradient(135deg,
        rgba(220,38,38,0.105) 0%,
        rgba(220,38,38,0.040) 30%,
        rgba(255,255,255,0.05) 58%);
    box-shadow:
      inset 1.5px 1.5px 1px -1px rgba(255,200,200,0.42),
      inset -1.5px -1.5px 1px -1px rgba(255,255,255,0.15),
      inset 0 0 8px 6px rgba(255,255,255,0.018),
      inset 26px 26px 46px -34px rgba(248,113,113,0.38),
      0 0 16px -11px rgba(220,38,38,0.22),
      0 4px 16px rgba(0,0,0,0.50);
  }
  .btn--glow::before{
    background:linear-gradient(135deg,
      rgba(255,125,125,0.10) 0%,
      rgba(220,38,38,0.035) 30%,
      transparent 58%);
  }
  /* Haz de luz oblicuo, difuminado: es lo que "ilumina en ángulo". */
  .btn--glow::after{
    content:"";
    position:absolute;
    top:-70%; left:-12%;
    width:52%; height:240%;
    background:linear-gradient(102deg, rgba(255,150,150,0.09), transparent 72%);
    transform:rotate(17deg);
    filter:blur(15px);
    pointer-events:none;
    z-index:0;
  }
  .btn--glow:hover, .btn--glow:focus-visible{
    border-color:rgba(220,38,38,0.46);
    box-shadow:
      inset 1.5px 1.5px 1px -1px rgba(255,190,190,0.80),
      inset -1.5px -1.5px 1px -1px rgba(255,255,255,0.28),
      inset 0 0 8px 6px rgba(255,255,255,0.032),
      inset 26px 26px 46px -34px rgba(248,113,113,0.78),
      0 0 28px -8px rgba(220,38,38,0.45),
      0 4px 16px rgba(0,0,0,0.50);
  }

  /* ── Icono: cristal dentro del cristal ─────────────────────────── */
  .btn .ico{
    flex:0 0 auto;
    width:var(--ico); height:var(--ico);
    display:grid; place-items:center;
    border-radius:10px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:
      inset 1px 1px 1px -0.5px rgba(255,255,255,0.45),
      inset -1px -1px 1px -0.5px rgba(255,255,255,0.18);
    color:var(--text);
  }
  .btn--glow .ico{
    background:rgba(220,38,38,0.09);
    border-color:rgba(220,38,38,0.18);
    color:#fca5a5;
  }
  .btn .ico svg{ width:var(--icosvg); height:var(--icosvg); }

  .btn .txt{ flex:1 1 auto; min-width:0; }
  .btn .label{
    display:block;
    font-size:var(--label);
    font-weight:600;
    letter-spacing:-0.012em;
    line-height:1.25;
  }
  .btn .meta{
    display:block;
    margin-top:2px;
    font-family:var(--mono);
    font-size:var(--meta);
    color:var(--muted);
    letter-spacing:0.01em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .btn .chev{
    flex:0 0 auto;
    color:var(--muted2);
    transition:color .16s ease, transform .16s ease;
  }
  .btn:hover .chev, .btn:focus-visible .chev{
    color:var(--text);
    transform:translateX(3px);
  }
  .btn .chev svg{ width:16px; height:16px; display:block; }

  .btn--person .ico{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--muted);
  }
  .btn--person:hover .ico, .btn--person:focus-visible .ico{
    color:var(--text);
  }

  /* ---------- separador ---------- */
  .sep{
    display:flex;
    align-items:center;
    gap:14px;
    margin:var(--sep-mt) 0 var(--sep-mb);
    color:var(--muted2);

      0 3px 12px rgba(0,0,0,0.45);
    color:var(--muted);
    -webkit-tap-highlight-color:transparent;
    transition:color .16s ease, border-color .16s ease, background-color .16s ease, transform .16s ease;

  .anim:nth-child(3){ animation-delay:.12s; }
  .anim:nth-child(4){ animation-delay:.17s; }
  .anim:nth-child(5){ animation-delay:.22s; }
  .anim:nth-child(6){ animation-delay:.27s; }
  .anim:nth-child(7){ animation-delay:.32s; }
  .anim:nth-child(8){ animation-delay:.37s; }

  @keyframes rise{

  /* Refracción del componente original. Chrome/Safari ignoran los

<!-- Filtro de desplazamiento del componente liquid-glass-button.

<svg class="glass-defs" aria-hidden="true" width="0" height="0" style="position:absolute">
  <defs>
    <filter id="container-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence"/>
      <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R" yChannelSelector="B" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur"/>
      <feComposite in="finalBlur" in2="finalBlur" operator="over"/>
    </filter>
  </defs>
</svg>

<script>
  /* Mantener la página al principio mientras el navegador se asienta.

     CAUSA REAL (verificada en el dispositivo): el fallo sólo aparece al
     abrir el enlace con Chrome CERRADO. En ese arranque en frío la app
     se lanza y su ventana cambia de tamaño mientras la página ya está
     cargando — primero sin barras, luego con ellas. Cada cambio hace
     re-evaluar las media queries de altura, el contenido se redimensiona
     y el scroll queda descolocado. Con Chrome ya abierto la ventana está
     estable y por eso ahí siempre funcionó.

     La versión anterior de este script no escuchaba 'resize', que es
     justo el evento de ese cambio. Ahora sí, y se insiste durante los
     primeros segundos, que es lo que dura el arranque.

     Se deja de corregir en cuanto la persona toca la pantalla: a partir
     de ahí el scroll es suyo. */
  (function () {
    var userMoved = false;

    function top() {
      if (!userMoved && window.scrollY !== 0) window.scrollTo(0, 0);
    }
    function release() { userMoved = true; }

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    top();
    addEventListener('DOMContentLoaded', top);
    addEventListener('load', top);
    addEventListener('pageshow', top);
    addEventListener('resize', top, { passive: true });          // ← el arranque en frío
    addEventListener('orientationchange', function () { setTimeout(top, 200); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) top(); });
    if (window.visualViewport) {
      visualViewport.addEventListener('resize', top, { passive: true });
    }
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(top); }

    /* El arranque en frío de la app puede tardar; se insiste un rato. */
    [30, 80, 150, 300, 500, 800, 1200, 1800, 2500, 3500, 5000].forEach(function (t) {
      setTimeout(top, t);
    });

    /* En cuanto la persona interactúa, el scroll deja de tocarse. */
    ['touchstart', 'touchmove', 'wheel', 'keydown'].forEach(function (ev) {
      addEventListener(ev, release, { passive: true, once: true });
    });
  })();
</script>
